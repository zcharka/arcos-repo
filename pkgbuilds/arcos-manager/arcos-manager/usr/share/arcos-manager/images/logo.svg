<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7057ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#926ee4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e0d6f0;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerShadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Inner subtle ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Package box - main body -->
  <g filter="url(#innerShadow)">
    <!-- Box bottom -->
    <path d="M 160 260 L 256 320 L 352 260 L 352 360 L 256 420 L 160 360 Z" 
          fill="url(#boxGrad)" opacity="0.85"/>
    <!-- Box left face -->
    <path d="M 160 260 L 256 320 L 256 420 L 160 360 Z" 
          fill="#d1c7f2" opacity="0.9"/>
    <!-- Box right face -->
    <path d="M 256 320 L 352 260 L 352 360 L 256 420 Z" 
          fill="#ffffff" opacity="0.8"/>
    <!-- Box top -->
    <path d="M 160 260 L 256 200 L 352 260 L 256 320 Z" 
          fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- Box top flap left -->
  <path d="M 160 260 L 256 200 L 256 160 L 130 240 Z" 
        fill="#e8e0f5" opacity="0.9" stroke="#926ee4" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Box top flap right -->
  <path d="M 256 200 L 352 260 L 382 240 L 256 160 Z" 
        fill="#f0eaf8" opacity="0.9" stroke="#926ee4" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Gear/cog on the box front -->
  <g transform="translate(256, 310)">
    <!-- Gear teeth -->
    <path d="M 0,-28 L 6,-26 L 8,-20 L 14,-18 L 18,-24 L 24,-18 L 20,-14 L 22,-8 L 28,-6 L 28,0 
             L 28,6 L 22,8 L 20,14 L 24,18 L 18,24 L 14,18 L 8,20 L 6,26 L 0,28 
             L -6,26 L -8,20 L -14,18 L -18,24 L -24,18 L -20,14 L -22,8 L -28,6 L -28,0 
             L -28,-6 L -22,-8 L -20,-14 L -24,-18 L -18,-24 L -14,-18 L -8,-20 L -6,-26 Z"
          fill="#7057ab" opacity="0.6"/>
    <!-- Gear center -->
    <circle cx="0" cy="0" r="10" fill="#926ee4" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.5"/>
  </g>
  
  <!-- Arrow up (publish/build indicator) -->
  <g transform="translate(256, 140)">
    <path d="M 0,-35 L 20,-10 L 10,-10 L 10,15 L -10,15 L -10,-10 L -20,-10 Z" 
          fill="#ffffff" opacity="0.95" filter="url(#innerShadow)"/>
  </g>
  
  <!-- Edge highlights -->
  <path d="M 160 260 L 256 200 L 352 260" 
        fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M 256 200 L 256 160" 
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
